name: .deb bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paket bauen
        id: build
        run: echo "deb=$(./packaging/build-deb.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lernsperre-deb
          path: ${{ steps.build.outputs.deb }}
      - name: Release veröffentlichen (nur auf main, einmal pro Version)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' daemon/lernsperre/__init__.py)
          DEB="${{ steps.build.outputs.deb }}"
          ./packaging/release-notes.sh "$VERSION" "$(basename "$DEB")" > /tmp/notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon, aktualisiere Paket und Beschreibung."
            gh release upload "v$VERSION" "$DEB" --clobber
            gh release edit "v$VERSION" --notes-file /tmp/notes.md
          else
            gh release create "v$VERSION" "$DEB" \
              --title "LernSperre $VERSION" --target "$GITHUB_SHA" --notes-file /tmp/notes.md
          fi
