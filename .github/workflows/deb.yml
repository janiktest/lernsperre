name: .deb bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paket bauen
        id: build
        run: echo "deb=$(./packaging/build-deb.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lernsperre-deb
          path: ${{ steps.build.outputs.deb }}
      - name: Release veröffentlichen (nur auf main, einmal pro Version)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' daemon/lernsperre/__init__.py)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon, lade das Paket neu hoch."
            gh release upload "v$VERSION" "${{ steps.build.outputs.deb }}" --clobber
          else
            gh release create "v$VERSION" "${{ steps.build.outputs.deb }}" \
              --title "LernSperre $VERSION" --target "$GITHUB_SHA" \
              --notes "Installieren: .deb herunterladen und mit \`sudo apt install ./$(basename "${{ steps.build.outputs.deb }}")\` installieren, danach einmal ab- und wieder anmelden."
          fi
